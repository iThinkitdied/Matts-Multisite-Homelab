---
# Docker Engine on nodes that run compose stacks.
- name: Install Docker
  hosts: all
  become: true
  tasks:
    - name: Install Docker via convenience script
      ansible.builtin.shell:
        cmd: curl -fsSL https://get.docker.com | sh
        creates: /usr/bin/docker

    - name: Ensure docker service is running
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Add deploy user to docker group (non-root compose)
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
